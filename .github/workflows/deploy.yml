name: Build and Deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: client
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: client
        run: flutter test

      - name: Build Flutter Web Demo
        working-directory: client
        run: flutter build web --release --base-href=/ --dart-define=API_BASE_URL=https://plantstory-production.up.railway.app/api/v1

      # Vercel 部署由 Vercel GitHub App 自动完成
      # 不需要在 GitHub Actions 中手动部署
