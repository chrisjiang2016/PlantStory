<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植の物语 - UI 设计演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #E8F5E9, #F7FBF4, #FFFBF0);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #1B5E20;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            color: #4A4A4A;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .section {
            margin-bottom: 48px;
        }

        .section-title {
            color: #2E7D32;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            color: #1B5E20;
            font-size: 32px;
            font-weight: 800;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .plant-card, .reminder-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .plant-card:hover, .reminder-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        .plant-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .plant-name {
            font-size: 18px;
            font-weight: 700;
            color: #1B5E20;
        }

        .plant-species {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        .plant-badge {
            background: #E8F5E9;
            color: #2E7D32;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .plant-info {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            font-size: 14px;
            color: #666;
        }

        .plant-info-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .reminder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .reminder-title {
            font-size: 16px;
            font-weight: 700;
            color: #1B5E20;
        }

        .reminder-type {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .type-water {
            background: #E3F2FD;
            color: #1976D2;
        }

        .type-fertilize {
            background: #FFF3E0;
            color: #F57C00;
        }

        .type-prune {
            background: #F3E5F5;
            color: #7B1FA2;
        }

        .reminder-plant {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .reminder-time {
            font-size: 13px;
            color: #43A047;
            font-weight: 600;
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Garden Section -->
        <div class="section">
            <h1>🌱 我的花园</h1>
            <p class="subtitle">种下每一盆植物，开启你的养护故事。</p>

            <div class="stats-cards">
                <div class="stat-card">
                    <div class="stat-label">总计植物</div>
                    <div class="stat-value">3</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">生长期</div>
                    <div class="stat-value">2</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">成熟期</div>
                    <div class="stat-value">1</div>
                </div>
            </div>

            <div class="section-title">
                🪴 我的植物
            </div>

            <div class="cards-grid">
                <div class="plant-card">
                    <div class="plant-header">
                        <div>
                            <div class="plant-name">客厅的小绿</div>
                            <div class="plant-species">绿萝 · Epipremnum aureum</div>
                        </div>
                        <div class="plant-badge">生长期</div>
                    </div>
                    <div class="plant-info">
                        <div class="plant-info-item">
                            📍 客厅窗台
                        </div>
                        <div class="plant-info-item">
                            🗓️ 种植 86 天
                        </div>
                    </div>
                </div>

                <div class="plant-card">
                    <div class="plant-header">
                        <div>
                            <div class="plant-name">阳台多肉</div>
                            <div class="plant-species">多肉植物 · Succulent</div>
                        </div>
                        <div class="plant-badge">成熟期</div>
                    </div>
                    <div class="plant-info">
                        <div class="plant-info-item">
                            📍 阳台
                        </div>
                        <div class="plant-info-item">
                            🗓️ 种植 120 天
                        </div>
                    </div>
                </div>

                <div class="plant-card">
                    <div class="plant-header">
                        <div>
                            <div class="plant-name">书房发财树</div>
                            <div class="plant-species">发财树 · Pachira aquatica</div>
                        </div>
                        <div class="plant-badge">生长期</div>
                    </div>
                    <div class="plant-info">
                        <div class="plant-info-item">
                            📍 书房
                        </div>
                        <div class="plant-info-item">
                            🗓️ 种植 45 天
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reminders Section -->
        <div class="section">
            <div class="section-title">
                🔔 养护提醒
            </div>

            <div class="stats-cards">
                <div class="stat-card">
                    <div class="stat-label">待办任务</div>
                    <div class="stat-value">2</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">今日任务</div>
                    <div class="stat-value">1</div>
                </div>
            </div>

            <div class="cards-grid">
                <div class="reminder-card">
                    <div class="reminder-header">
                        <div class="reminder-title">浇水提醒</div>
                        <div class="reminder-type type-water">浇水</div>
                    </div>
                    <div class="reminder-plant">🌱 阳台多肉</div>
                    <div class="reminder-time">⏰ 1小时后 (今天 19:30)</div>
                </div>

                <div class="reminder-card">
                    <div class="reminder-header">
                        <div class="reminder-title">施肥提醒</div>
                        <div class="reminder-type type-fertilize">施肥</div>
                    </div>
                    <div class="reminder-plant">🌱 书房发财树</div>
                    <div class="reminder-time">⏰ 2天后 (8月14日 18:30)</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
