# ============================================
# 植の物语 Docker Compose 配置
# ============================================
# 服务：
# - postgres: PostgreSQL 数据库
# - backend: NestJS API 服务
# - frontend: Flutter Web + Nginx
# ============================================

version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: plant-story-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plant_story}
      POSTGRES_USER: ${POSTGRES_USER:-plant_story_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plant_story_user} -d ${POSTGRES_DB:-plant_story}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plant-story-network

  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plant-story-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-plant_story_user}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-plant_story}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_use_long_random_string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BAIDU_API_KEY: ${BAIDU_API_KEY}
      BAIDU_SECRET_KEY: ${BAIDU_SECRET_KEY}
      PERENUAL_API_KEY: ${PERENUAL_API_KEY}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - plant-story-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务（Flutter Web + Nginx）
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: plant-story-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - plant-story-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# 数据卷（持久化存储）
volumes:
  postgres_data:
    name: plant-story-postgres-data

# 网络
networks:
  plant-story-network:
    name: plant-story-network
    driver: bridge
