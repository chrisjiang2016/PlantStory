<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02 - 首页 | 植の物语</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #fff9e6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .phone-frame {
            width: 375px;
            height: 812px;
            background: #fafafa;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
        }
        /* 顶部导航 */
        .top-bar {
            background: linear-gradient(135deg, #66bb6a 0%, #81c784 100%);
            padding: 50px 20px 25px;
            color: white;
        }
        .greeting {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 300;
        }
        /* 快捷操作 */
        .quick-actions {
            display: flex;
            gap: 15px;
            padding: 20px;
            background: white;
            margin: -20px 15px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .action-btn {
            flex: 1;
            background: linear-gradient(135deg, #e8f5e9 0%, #fff9e6 100%);
            border: none;
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 187, 106, 0.2);
        }
        .action-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }
        .action-text {
            font-size: 13px;
            color: #2e7d32;
            font-weight: 500;
        }
        /* 内容区 */
        .content {
            padding: 0 20px 80px;
            overflow-y: auto;
            height: calc(100% - 200px);
        }
        .section-title {
            font-size: 18px;
            color: #2e7d32;
            font-weight: 500;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* 植物卡片 */
        .plant-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            gap: 15px;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
        }
        .plant-card:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 25px rgba(102, 187, 106, 0.15);
        }
        .plant-image {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            background: linear-gradient(135deg, #e8f5e9 0%, #fff9e6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            flex-shrink: 0;
        }
        .plant-info {
            flex: 1;
        }
        .plant-name {
            font-size: 16px;
            color: #2e7d32;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .plant-meta {
            font-size: 13px;
            color: #757575;
            margin-bottom: 8px;
        }
        .plant-status {
            display: flex;
            gap: 10px;
        }
        .status-tag {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }
        .status-tag.urgent {
            background: #fff3e0;
            color: #f57c00;
        }
        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: white;
            padding: 12px 20px 25px;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #f0f0f0;
        }
        .nav-item {
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
        }
        .nav-item.active .nav-icon {
            color: #2e7d32;
        }
        .nav-item.active .nav-label {
            color: #2e7d32;
        }
        .nav-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
            color: #9e9e9e;
        }
        .nav-label {
            font-size: 11px;
            color: #9e9e9e;
        }
        /* 返回导航 */
        .nav-back {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <a href="index.html" class="nav-back">← 返回</a>
        
        <!-- 顶部栏 -->
        <div class="top-bar">
            <div class="greeting">早安，Chris 🌸</div>
            <div class="subtitle">今天有 2 项养护任务</div>
        </div>
        
        <!-- 快捷操作 -->
        <div class="quick-actions">
            <a href="03-拍照识别.html" class="action-btn">
                <span class="action-icon">📷</span>
                <span class="action-text">拍照识别</span>
            </a>
            <a href="05-养护提醒.html" class="action-btn">
                <span class="action-icon">🔔</span>
                <span class="action-text">今日任务</span>
            </a>
            <a href="07-植物百科.html" class="action-btn">
                <span class="action-icon">📚</span>
                <span class="action-text">植物百科</span>
            </a>
        </div>
        
        <!-- 内容区 -->
        <div class="content">
            <div class="section-title">
                <span>🌱</span>
                我的植物 (3)
            </div>
            
            <a href="04-植物详情.html" class="plant-card">
                <div class="plant-image">🌿</div>
                <div class="plant-info">
                    <div class="plant-name">绿萝</div>
                    <div class="plant-meta">养护 32 天 · 客厅阳台</div>
                    <div class="plant-status">
                        <span class="status-tag urgent">今日浇水</span>
                        <span class="status-tag">生长良好</span>
                    </div>
                </div>
            </a>
            
            <a href="04-植物详情.html" class="plant-card">
                <div class="plant-image">🌵</div>
                <div class="plant-info">
                    <div class="plant-name">仙人掌</div>
                    <div class="plant-meta">养护 58 天 · 书房窗台</div>
                    <div class="plant-status">
                        <span class="status-tag">3天后浇水</span>
                    </div>
                </div>
            </a>
            
            <a href="04-植物详情.html" class="plant-card">
                <div class="plant-image">🌸</div>
                <div class="plant-info">
                    <div class="plant-name">蝴蝶兰</div>
                    <div class="plant-meta">养护 15 天 · 客厅茶几</div>
                    <div class="plant-status">
                        <span class="status-tag urgent">今日施肥</span>
                    </div>
                </div>
            </a>
        </div>
        
        <!-- 底部导航 -->
        <div class="bottom-nav">
            <a href="02-首页.html" class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">首页</span>
            </a>
            <a href="03-拍照识别.html" class="nav-item">
                <span class="nav-icon">📷</span>
                <span class="nav-label">识别</span>
            </a>
            <a href="06-病虫害诊断.html" class="nav-item">
                <span class="nav-icon">🩺</span>
                <span class="nav-label">诊断</span>
            </a>
            <a href="07-植物百科.html" class="nav-item">
                <span class="nav-icon">📚</span>
                <span class="nav-label">百科</span>
            </a>
            <a href="08-个人中心.html" class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-label">我的</span>
            </a>
        </div>
    </div>
</body>
</html>
